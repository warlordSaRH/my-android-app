workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    triggering:
      events:
        - push
    scripts:
      - name: Build Android APK
        script: |
          cd mutajri_android_mvp
          gradle assembleDebug
    artifacts:
      - mutajri_android_mvp/app/build/outputs/apk/**/*.apk
